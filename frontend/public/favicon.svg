<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 极光流光边框渐变（与网站顶部 Logo 保持一致） -->
    <linearGradient id="auroraBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- 内部暗夜微光背景 -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="100%" stop-color="#060a15" />
    </radialGradient>
    <!-- 文字/徽章发光渐变 -->
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- 外层极光渐变圆角矩形 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#auroraBorder)" />
  <!-- 内层深邃暗夜底 -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#bgGlow)" />

  <!-- Dota2 经典斜切对角装饰线（低透明度，增加电竞质感但不抢主视觉） -->
  <path d="M14 48 L48 14" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.22" />
  <circle cx="16" cy="16" r="3" fill="#f43f5e" opacity="0.75" />
  <circle cx="48" cy="48" r="3" fill="#34d399" opacity="0.75" />

  <!-- 居中醒目的“毒”字徽章 -->
  <text
    x="32"
    y="42.5"
    text-anchor="middle"
    font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif"
    font-weight="900"
    font-size="31"
    fill="url(#textGlow)"
  >毒</text>
</svg>
